<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Gateway | ClayCanvas</title>
    {% load static %}
    <link href="{% static 'css/styles.css' %}" rel="stylesheet" />
</head>
<body class="bg-[#F8F3EC] text-[#6B5E53] font-sans flex items-center justify-center min-h-screen antialiased">

    <div class="text-center px-6 max-w-sm">
        <div class="relative w-24 h-24 mx-auto mb-8">
            <div class="absolute inset-0 border-4 border-[#DDD2C5] rounded-full"></div>
            <div class="absolute inset-0 border-4 border-[#B65E3C] border-t-transparent rounded-full animate-spin"></div>
            <div class="absolute inset-4 bg-[#FFFCF7] rounded-full flex items-center justify-center border border-[#DDD2C5] shadow-sm">
                <i data-lucide="shield-check" class="w-6 h-6 text-[#B65E3C] animate-pulse"></i>
            </div>
        </div>

        <h2 class="text-[#4A3428] font-bold uppercase tracking-widest text-xl mb-2 font-serif">
            Connecting <span class="text-[#B65E3C]">Gateway</span>
        </h2>
        <p class="text-[#6B5E53]/70 text-[10px] font-bold uppercase tracking-widest">
            Encrypting secure payment connection...
        </p>

        <form id="esewa_form" action="{{ esewa_url }}" method="POST">
            <input type="hidden" name="amount" value="{{ amount }}">
            <input type="hidden" name="tax_amount" value="0">
            <input type="hidden" name="total_amount" value="{{ amount }}">
            <input type="hidden" name="transaction_uuid" value="{{ transaction_uuid }}">
            <input type="hidden" name="product_code" value="{{ product_code }}">
            <input type="hidden" name="product_service_charge" value="0">
            <input type="hidden" name="product_delivery_charge" value="0">
            <input type="hidden" name="success_url" value="{{ success_url }}">
            <input type="hidden" name="failure_url" value="{{ failure_url }}">
            <input type="hidden" name="signed_field_names" value="total_amount,transaction_uuid,product_code">
            <input type="hidden" name="signature" value="{{ signature }}">
        </form>
    </div>

    <script src="{% static 'js/lucide.min.js' %}"></script>
    <script>
        lucide.createIcons();

        window.onload = function() {
            setTimeout(function() {
                document.getElementById('esewa_form').submit();
            }, 800); 
        };
    </script>
</body>
</html>
